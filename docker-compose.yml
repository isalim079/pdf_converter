name: pdf-converter-api

x-app-env: &app-env
  NODE_ENV: production
  PORT: 3050
  LOG_LEVEL: info
  SWAGGER_ENABLED: "false"
  GOTENBERG_URL: http://gotenberg:3000
  GOTENBERG_REQUIRED: "true"
  PDF_TEMP_DIR: /tmp/pdf-service

services:
  gotenberg:
    build:
      context: ./docker/gotenberg
      dockerfile: Dockerfile
    command:
      - gotenberg
      - --api-timeout=120s
      - --libreoffice-restart-after=10
      - --log-level=info
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${PDF_GOTENBERG_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *app-env
    depends_on:
      gotenberg:
        condition: service_healthy
    ports:
      - "3050:3050"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3050/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
